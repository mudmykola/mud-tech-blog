name: Firebase Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: firebase-deploy-master
  cancel-in-progress: true

jobs:
  deploy:
    name: Test, Build, Deploy (Firebase Hosting)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build app
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project mud-tech-blog --token "${{ secrets.FIREBASE_TOKEN }}"
